name: CI - Staging

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean Next cache
        run: rm -rf .next

      - name: Lint app
        run: npm run lint:app

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
