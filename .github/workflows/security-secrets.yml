name: Security - Secret Scan

on:
  pull_request:
  push:
    branches:
      - staging

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan repository for secrets
        run: node scripts/scan-secrets.mjs

      - name: Run security regression checks
        run: node scripts/security-regression-check.mjs
